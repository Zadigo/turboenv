name: Test TurboEnv

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/

      - name: Run build
        run: uv build
