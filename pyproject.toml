[project]
name = "turboenv"
version = "0.2.0a2"
description = "TurboEnv is a Python library that provides a simple and efficient way to manage environment variables in your applications. It allows you to easily load environment variables from .env files, access them in your code, and handle different environments (development, testing, production) with ease."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
  {name = "John Pendenque", email = "pendenquejohn@gmail.com"},
]
maintainers = [
  {name = "John Pendenque", email = "pendenquejohn@gmail.com"}
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Developers",
  "Topic :: Internet",
  "Topic :: Internet :: WWW/HTTP",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS"
]
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "coverage>=7.14.1",
    "django>=6.0.6",
    "django-environ>=0.13.0",
    "dotenv>=0.9.9",
    "factory-boy>=3.3.3",
    "fastapi[standard]>=0.136.3",
    "pytest>=9.0.3",
    "pytest-aio>=2.1.7",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.6.0",
    "pytest-reportlog>=1.0.0",
    "ruff>=0.15.16",
]

[project.urls]
Homepage = "https://github.com/Zadigo/turboenv"
Documentation = "https://github.com/Zadigo/turboenv/wiki"
Repository = "https://github.com/Zadigo/turboenv.git"
Changelog = "https://github.com/Zadigo/turboenv/blob/main/CHANGELOG.md"

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = true
reportUntypedBaseClass = true

[tool.pytest]
testpaths = ["tests"]
timeout="5000"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as api tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pytest_env]
env_files = [".env", ".env.test"]

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 3

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.coverage.run]
omit = [
    "manage.py",
    "*/migrations/*",
    "*/__init__.py",
    "*/typings.py",
    "conftest.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.uv.build-backend]
source-exclude = [
    "**/tests/**",
    "docs/**",
    "*.log",
    "**/.DS_Store",
    "conftest.py",
    "manage.py"
]
